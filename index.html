<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="description" content="SAU Solutions brings trusted services, everyday essentials and local professionals together in one thoughtful place." />
    <title>SAU SOLUTIONS — All Services in One App</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const redirect = sessionStorage.getItem('sau-pages-redirect')
      if (redirect) {
        sessionStorage.removeItem('sau-pages-redirect')
        const target = new URL(redirect)
        if (target.origin === location.origin && target.pathname.startsWith('/SAU-SOLUTIONS-WEB/')) {
          history.replaceState(null, '', target.pathname + target.search + target.hash)
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
