<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#f7f9fc"
    />

    <script>
      try {
        const savedTheme = localStorage.getItem('sau-theme-v1');
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>

    <!-- Primary SEO Metadata -->
    <title>SAU SOLUTIONS | Local Services & Vendors in Hyderabad</title>

    <meta
      name="description"
      content="Discover SAU SOLUTIONS and SAU SERVICES in Hyderabad. Connect with local vendors, shops, service professionals, mechanics, and delivery partners."
    />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://sausolution.com/" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
    />

    <!-- Open Graph Metadata (Social Sharing) -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://sausolution.com/"
    />

    <meta
      property="og:site_name"
      content="SAU SOLUTIONS"
    />

    <meta
      property="og:title"
      content="SAU SOLUTIONS | Local Services, Vendors & Delivery"
    />

    <meta
      property="og:description"
      content="Explore SAU SERVICES and connect with local vendors, shops, mechanics, service professionals, and delivery partners in Hyderabad."
    />

    <meta
      property="og:image"
      content="https://sausolution.com/og-image.png"
    />

    <!-- Twitter / X Sharing Metadata -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="SAU SOLUTIONS | Local Services & Vendors"
    />

    <meta
      name="twitter:description"
      content="Discover local vendors, shops, service professionals, mechanics, and delivery partners with SAU SOLUTIONS in Hyderabad."
    />

    <meta
      name="twitter:image"
      content="https://sausolution.com/og-image.png"
    />

    <!-- Application Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
